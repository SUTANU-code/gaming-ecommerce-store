spring.application.name=gaming
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# GEMINI AI

spring.ai.openai.api-key=${GEMINI_API_KEY}

spring.ai.openai.base-url=https://generativelanguage.googleapis.com

spring.ai.openai.chat.completions-path=/v1beta/openai/chat/completions

spring.ai.openai.chat.options.model=gemini-2.5-flash
spring.config.import=optional:application-secret.properties

razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# CORS + admin setup
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,https://gaming-frontend-ten.vercel.app}
app.admin-setup-key=${ADMIN_SETUP_KEY:}
jwt.secret=${JWT_SECRET:gaming_store_secret_key_for_jwt_authentication_2026}
